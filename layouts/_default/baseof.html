<!doctype html>
<html lang="en-NZ" data-theme="noir">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ .Title }} · Personal training in Tawa{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ .Params.description | default "A small, private personal training studio in Tawa, Wellington. One on one or small group, no contracts, from $30 a session." }}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Revolve Fitness">
  <meta property="og:title" content="{{ if .IsHome }}Revolve Fitness · Personal, not packed{{ else }}{{ .Title }}{{ end }}">
  <meta property="og:description" content="{{ .Params.description | default "A small, private personal training studio in Tawa, Wellington. One on one or small group, no contracts, from $30 a session." }}">
  <meta property="og:image" content="{{ "img/og.jpg" | absURL }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0a0a0b">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="{{ "favicon.png" | relURL }}">
  <link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
  <script src="{{ "js/app.js" | relURL }}" defer></script>
</head>
<body>
  {{ partial "nav.html" . }}
  {{ block "main" . }}{{ end }}
  {{ partial "footer.html" . }}
</body>
</html>
